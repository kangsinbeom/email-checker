[project]
name = "email-checker"
version = "0.1.0"
description = "Email triage powered by the Laya decision model"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "discord-py>=2.7",
    "laya>=0.4.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
